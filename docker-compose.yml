services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${MODELS:-qwen2.5-coder:7b}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for m in $$MODELS; do
          echo ">> pulling $$m"
          ollama pull "$$m"
        done
        echo ">> done"
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MODEL: ${LITELLM_MODEL:-ollama_chat/qwen2.5-coder:7b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  ruflo:
    build:
      context: .
      dockerfile: Dockerfile
    image: local-ai-dev/ruflo:latest
    profiles: ["cli"]
    depends_on:
      ollama:
        condition: service_healthy
      litellm:
        condition: service_started
    environment:
      ANTHROPIC_BASE_URL: http://litellm:4000
      ANTHROPIC_API_KEY: sk-local-anything
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_API_BASE: http://ollama:11434
      RUFLO_DEFAULT_MODEL: ${RUFLO_DEFAULT_MODEL:-qwen2.5-coder:7b}
    volumes:
      - .:/workspace
      - ruflo-home:/home/ruflo
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["bash"]

volumes:
  ollama-models:
  ruflo-home:
